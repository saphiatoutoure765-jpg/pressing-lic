<div class="container mt-5" style="max-width: 400px;">
  <h2 class="mb-4">Connexion</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSoumettre()" autocomplete="off">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" formControlName="email" autocomplete="off">
      @if (email?.invalid && email?.touched) {
        <div class="text-danger small">Email invalide</div>
      }
    </div>

    <div class="mb-3">
      <label class="form-label">Mot de passe</label>
      <input type="password" class="form-control" formControlName="password" autocomplete="off">
      @if (password?.invalid && password?.touched) {
        <div class="text-danger small">6 caractères minimum</div>
      }
    </div>

    @if (erreur) {
      <div class="alert alert-danger">{{ erreur }}</div>
    }

    <button type="submit" class="btn btn-primary w-100" [disabled]="chargement">
      {{ chargement ? 'Connexion...' : 'Se connecter' }}
    </button>
  </form>

  <p class="mt-3 text-center">
    Pas encore de compte ? <a routerLink="/register">S'inscrire</a>
  </p>
</div>
