<div class="container mt-5" style="max-width: 400px;">
  <h2 class="mb-4">Créer un compte</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onSoumettre()">
    <div class="mb-3">
      <label class="form-label">Nom</label>
      <input type="text" class="form-control" formControlName="name">
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" formControlName="email">
    </div>

    <div class="mb-3">
      <label class="form-label">Mot de passe</label>
      <input type="password" class="form-control" formControlName="password">
    </div>

    <div class="mb-3">
      <label class="form-label">Confirmer le mot de passe</label>
      <input type="password" class="form-control" formControlName="password_confirmation">
    </div>

    @if (erreur) {
      <div class="alert alert-danger">{{ erreur }}</div>
    }

    <button type="submit" class="btn btn-primary w-100" [disabled]="chargement">
      {{ chargement ? 'Inscription...' : 'S\'inscrire' }}
    </button>
  </form>

  <p class="mt-3 text-center">
    Déjà un compte ? <a routerLink="/login">Se connecter</a>
  </p>
</div>
